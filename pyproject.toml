[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yongin-public-data-ai"
version = "0.1.0"
description = "Yongin public leisure data analysis MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.2,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "SQLAlchemy>=2.0,<3",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
